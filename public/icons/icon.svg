<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#090d16" />
  <circle cx="256" cy="256" r="200" fill="url(#grad)" opacity="0.1" />
  
  <!-- Stylized Guitar Pick / Body -->
  <path d="M 256 90 C 370 90 410 210 350 350 C 310 440 256 460 256 460 C 256 460 202 440 162 350 C 102 210 142 90 256 90 Z" fill="url(#grad)" filter="url(#glow)" />
  
  <!-- Sound Hole -->
  <circle cx="256" cy="240" r="55" fill="#090d16" />
  <circle cx="256" cy="240" r="62" stroke="#fef08a" stroke-width="4" fill="none" opacity="0.6" />
  
  <!-- Strings -->
  <line x1="230" y1="110" x2="230" y2="400" stroke="#f8fafc" stroke-width="3" opacity="0.8" />
  <line x1="240" y1="100" x2="240" y2="410" stroke="#f8fafc" stroke-width="3.5" opacity="0.85" />
  <line x1="250" y1="95" x2="250" y2="420" stroke="#f8fafc" stroke-width="4" opacity="0.9" />
  <line x1="262" y1="95" x2="262" y2="420" stroke="#f8fafc" stroke-width="4" opacity="0.9" />
  <line x1="272" y1="100" x2="272" y2="410" stroke="#f8fafc" stroke-width="3.5" opacity="0.85" />
  <line x1="282" y1="110" x2="282" y2="400" stroke="#f8fafc" stroke-width="3" opacity="0.8" />
</svg>
